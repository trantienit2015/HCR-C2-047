[project]
name = "hcr-c2-047"
version = "0.1.0"
description = "Elderly Care Vital Anomaly & Family Notification Agent — AgentCore Template"
requires-python = ">=3.11"
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# Resolves against the module BEING CHECKED, not the base class's module, so it
# cannot be scoped into an override -- every node subclassing the untyped framework
# would trip it otherwise.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# This one resolves against the IMPORTED module, so scoping it here does work.
module = ["framework.*", "shared.*"]
ignore_missing_imports = true
